<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T45 - Plataforma</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
}

header{
    background:#171717;
    padding:15px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid #333;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:#ffc400;
}

.saldo{
    background:#292929;
    padding:10px 14px;
    border-radius:20px;
}

.categorias{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-top:15px;
}

.categorias button{
    min-width:90px;
    padding:10px;
    border:1px solid #733000;
    border-radius:12px;
    background:#24150f;
    color:white;
    cursor:pointer;
}

.container{
    padding:15px;
    padding-bottom:100px;
}

.titulo{
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
}

.jogos{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.jogo{
    background:#191919;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #292929;
    cursor:pointer;
}

.imagem-jogo{
    height:150px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:65px;
    background:linear-gradient(135deg,#761b10,#27104d);
}

.nome-jogo{
    padding:10px;
    font-weight:bold;
}

.btn-jogar{
    width:100%;
    padding:10px;
    border:0;
    background:#e86c0b;
    color:white;
    font-weight:bold;
}

/* MENU */
.menu-inferior{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:75px;
    background:#1c110d;
    border-top:1px solid #653014;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:20;
}

.menu-inferior button{
    background:none;
    border:0;
    color:#ddd;
    cursor:pointer;
    font-size:12px;
}

.menu-inferior button div{
    font-size:25px;
    margin-bottom:4px;
}

.menu-inferior .deposito{
    color:#ffc400;
}

/* PÁGINAS */
.pagina{
    display:none;
    min-height:calc(100vh - 100px);
}

.pagina.ativa{
    display:block;
}

/* MODAL */
.modal-fundo{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal{
    background:#181818;
    width:100%;
    max-width:450px;
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:20px;
    position:relative;
}

.fechar{
    position:absolute;
    right:12px;
    top:8px;
    border:0;
    background:none;
    color:white;
    font-size:30px;
    cursor:pointer;
}

/* QR */
.qr{
    width:100%;
    max-width:350px;
    display:block;
    margin:20px auto;
    background:white;
    padding:8px;
    border-radius:10px;
}

.botao{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#e96d0c;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

input{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#0e0e0e;
    color:white;
    border:1px solid #444;
    border-radius:10px;
}

.info{
    background:#191919;
    padding:18px;
    border-radius:15px;
    margin-top:15px;
}

@media(min-width:700px){
    .jogos{
        grid-template-columns:repeat(4,1fr);
    }

    .container{
        max-width:1100px;
        margin:auto;
    }
}
</style>
</head>
