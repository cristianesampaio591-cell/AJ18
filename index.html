<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AJ18 - Plataforma</title><style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#08090b;color:#fff}
header{height:70px;background:#111318;border-bottom:1px solid #292c32;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.logo{font-size:30px;font-weight:900;color:#ff8500}.top{display:flex;gap:12px;align-items:center}
.balance{padding:12px 18px;border:1px solid #30343b;border-radius:10px;background:#0d0f13}
button{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.deposit{background:#ff8500;color:#111}
.layout{display:flex;min-height:calc(100vh - 70px)} aside{width:220px;background:#0e1014;border-right:1px solid #24272d;padding:18px}
nav button{width:100%;margin:5px 0;background:transparent;color:#b9bec8;text-align:left}
nav button:hover,nav .active{background:#21180e;color:#ff9700}
main{flex:1;padding:26px;max-width:1300px;margin:auto}
.banner{height:180px;border-radius:18px;background:linear-gradient(110deg,#281705,#0e1116);border:1px solid #3a2a18;padding:30px;display:flex;align-items:center;justify-content:space-between}
.banner h1{margin:0;font-size:30px}.banner p{color:#b8bdc7}.section{margin-top:28px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.game{height:150px;border:1px solid #292d34;border-radius:14px;background:linear-gradient(145deg,#1b1e24,#0d0f13);display:flex;align-items:end;padding:16px;font-weight:800}.game span{color:#ff8a00}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;align-items:center;justify-content:center;padding:18px}
.modal{width:min(520px,100%);max-height:94vh;overflow:auto;background:#111419;border:1px solid #343941;border-radius:18px;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:transparent;color:#fff;font-size:28px;padding:2px 8px}
.pix-title{text-align:center;margin:10px 0 8px;font-size:38px}.subtitle{text-align:center;color:#c6cad1;margin-bottom:18px}
.qr{display:block;width:min(360px,90%);margin:20px auto;border:10px solid #fff}.dash{border-top:1px dashed #555;margin:20px 0}
.info-title{font-size:20px;font-weight:800;margin-bottom:16px}.info-row{display:flex;justify-content:space-between;gap:20px;padding:8px 0;color:#aaa}
.info-row strong{color:#fff;text-align:right;word-break:break-word}.notice{margin-top:18px;border:1px solid #414750;border-radius:12px;padding:15px;color:#d7dae0;font-size:14px;line-height:1.45}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #333;background:#0b0d10;color:white;margin:8px 0 14px}
@media(max-width:700px){aside{display:none}main{padding:15px}.banner{height:auto;min-height:170px}.balance{display:none}}
</style></head>
